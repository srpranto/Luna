<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="55%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#030304" />
    </radialGradient>
    <radialGradient id="moonGlow" cx="30%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f4f4f5" />
      <stop offset="85%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>
    <radialGradient id="auraGrad" cx="45%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="14" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />

  <!-- Soft Lunar Atmosphere Glow -->
  <circle cx="32" cy="32" r="24.32" fill="url(#auraGrad)" />

  <!-- Twinkling Distant Stars -->
  <circle cx="46.08" cy="19.84" r="0.896" fill="#ffffff" opacity="0.9" />
  <circle cx="49.92" cy="35.84" r="0.704" fill="#e4e4e7" opacity="0.8" />
  <circle cx="16.64" cy="45.44" r="0.576" fill="#cbd5e1" opacity="0.65" />
  <circle cx="17.92" cy="18.560000000000002" r="0.64" fill="#ffffff" opacity="0.75" />
  <circle cx="39.68" cy="48.64" r="0.512" fill="#94a3b8" opacity="0.5" />

  <!-- Geometrically Perfect Crescent Moon -->
  <path d="M 32 10.879999999999999 A 21.12 21.12 0 0 0 32 53.120000000000005 A 24.32 24.32 0 0 1 32 10.879999999999999 Z"
        fill="url(#moonGlow)" filter="url(#softGlow)" />
</svg>